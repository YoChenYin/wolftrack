name: Daily market data batch

# 排程時間是 UTC，且不會自動跟著美股日光節約時間調整（EST/EDT 差1小時），
# 這裡抓寬鬆一點的時間點，避免剛好卡在收盤資料還沒好的邊界。
on:
  schedule:
    # 美股批次：約當美東 19:00-20:00（EDT: 23:00-00:00 UTC，EST: 00:00-01:00 UTC）
    - cron: "30 23 * * 1-5"
    # 台股每日更新：約當台北時間 17:00（UTC+8，無日光節約）
    - cron: "0 9 * * 1-5"
    # 台指期 Decision OS：跟在 tw-daily/taifex-daily 後面約當台北時間 17:15，留15分鐘緩衝——
    # tw-daily/taifex-daily 都是fire-and-forget（打了就回202，背景才真的在寫DB），Decision OS
    # 需要當天的TAIEX收盤價跟最新PCR都已經寫完，直接掛在同一個「0 9」觸發點會有讀到舊資料的風險
    - cron: "15 9 * * 1-5"
    # 台股每日異動報告v1（dailyMarketDiff.ts）：再晚5分鐘（台北時間17:20），需要tw-daily
    # 把當天的daily_trend_signals/tw_daily_price都寫完才有東西可以比對「今天vs昨天」
    - cron: "20 9 * * 1-5"
    # 台股月營收：官方每月10日左右公布上月營收，抓 10-12 號三天當緩衝（免費 GitHub Actions
    # 排程本身就不保證準時，公司申報也可能延遲，重跑同一天資料是安全的 upsert，不會壞掉）
    - cron: "0 9 10-12 * *"
    # 台股季度累積EPS：財報公告日期比月營收分散（各公司申報期限不同，集中在季底後1.5-2個月），
    # 抓每月15-17號當中間點常態重跑，端點本身只回傳「最新一期」，重跑是安全的upsert
    - cron: "30 9 15-17 * *"
    # 法人報告（玉山證券「台股熱點」「總經盤勢」，見esunsecClient.ts）：每天約當台北時間
    # 17:30，跟在tw-daily/decision-os-daily後面留緩衝。這類文章一天約1-2篇，8篇/次的額度
    # 綽綽有餘，不用像法說會那樣一次排5輪
    - cron: "30 9 * * *"
    # YouTube 頻道新影片發現：每天（含週末，頻道週末也發文）約當台北時間 23:30，覆蓋3個頻道
    # 當天典型的發文時間（EBC 21:00、游庭皓 08:30 隔天才追上、Gooaye 不定期）
    - cron: "30 15 * * *"
    # YouTube LLM解析：跑在 youtube-transcribe.yml（01:00台北時間，最長90分鐘）後面留足
    # 緩衝，約當台北時間 03:00。2026-07-21改版：這步之前是fire-and-forget掛在ingest-transcript
    # 裡執行，依賴Zeabur container活到背景Promise跑完，production實測成功率只有約1成
    # （推測跟container重啟/自動部署有關）；改成跟transcribe一樣由GitHub Actions排程驅動、
    # awaited呼叫/api/youtube/parse-pending，才能確保真的跑完才算數
    - cron: "0 19 * * *"
  workflow_dispatch: {}

jobs:
  us-batch:
    if: github.event.schedule == '30 23 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger US daily batch
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/us-batch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  tw-daily:
    if: github.event.schedule == '0 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TW daily update
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/tw-daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  taifex-daily:
    if: github.event.schedule == '0 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TAIFEX daily update (台指期基差 + Put/Call比)
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/taifex-daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  decision-os-daily:
    if: github.event.schedule == '15 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Decision OS daily run（台股環境/法人籌碼/技術分析評分 + Gate/風控引擎）
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/decision-os-daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  tw-daily-report:
    if: github.event.schedule == '20 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TW daily market diff report v1（戰術分類轉換/支撐壓力突破/法人成本翻轉）
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/tw-daily-report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  global-macro-sync:
    if: github.event.schedule == '0 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Decision Lab global market sync（SPX/NASDAQ/DOW/BTC/WTI/DXY/US10Y/US2Y/VIX）
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/global-macro-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  decision-lab-daily:
    if: github.event.schedule == '15 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Decision Lab daily run（Regime/Trading Score/Scenario/Trading Plan）
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/decision-lab-daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  tw-revenue:
    if: github.event.schedule == '0 9 10-12 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TW monthly revenue fetch
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/tw-revenue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  tw-quarterly-eps:
    if: github.event.schedule == '30 9 15-17 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TW quarterly cumulative EPS fetch
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/tw-quarterly-eps" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  institutional-reports:
    if: github.event.schedule == '30 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger institutional report ingest (玉山證券台股熱點/總經盤勢)
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/institutional-reports" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  youtube-discovery:
    if: github.event.schedule == '30 15 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger YouTube video discovery
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/youtube-discovery" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  youtube-parse:
    if: github.event.schedule == '0 19 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pending LLM parse for already-transcribed videos
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/youtube/parse-pending" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
