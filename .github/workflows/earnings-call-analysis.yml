name: Leader stock earnings call analysis

# 2026-07-25：抓龍頭股（group_config.json的leader，目前48檔）法說會簡報PDF，LLM解析出
# 獲利成長/展望/風險，給出基本面訊號（src/lib/marketData/runEarningsCallAnalysis.ts）。
# 法說會一季一次，但同一波財報季常常很多公司擠在同一兩週公布，單次呼叫限制在8篇
# （PROCESS_BUDGET_PER_INVOCATION），這裡在同一次排程內連續呼叫幾次把當週新出現的
# 法說會盡量處理完，不用真的等到下週才處理完一整批財報季的量。
on:
  schedule:
    # 每週一台北時間 06:00
    - cron: "0 22 * * 1"
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run batched earnings call analysis
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in $(seq 1 5); do
            RESPONSE=$(curl -sf -X POST "$APP_URL/api/cron/earnings-call-analysis" \
              -H "Authorization: Bearer $CRON_SECRET")
            echo "round $i: $RESPONSE"

            PROCESSED=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('totalProcessed', -1))")
            if [ "$PROCESSED" = "0" ]; then
              echo "這輪沒有新的法說會可以處理，提早結束"
              break
            fi
            sleep 15
          done
